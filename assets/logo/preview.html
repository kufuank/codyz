<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kodjitsu logo v2 konseptleri</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#F6F2E9;color:#15110E}
.row{display:grid;grid-template-columns:1fr 1fr}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:8px;min-height:30vh}
.cell.dark{background:#0E0B09;color:#F6F2E9}
.cell img{max-width:82%;max-height:210px}
.cell small{opacity:.6;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
</style>
</head>
<body>
<div class="row">
  <div class="cell"><small>A · Tek fırça darbesi (one-line)</small><img src="v2-oneline.svg"></div>
  <div class="cell dark"><small>A · dark</small><img src="v2-oneline.svg"></div>
</div>
<div class="row">
  <div class="cell"><small>B · YZ = yeni nesil (gizli ok)</small><img src="v2-yz-arrow.svg"></div>
  <div class="cell dark"><small>B · dark</small><img src="v2-yz-arrow.svg"></div>
</div>
<div class="row">
  <div class="cell"><small>C · C'nin içindeki tilki (negatif alan)</small><img src="v2-fox-c.svg"></div>
  <div class="cell dark"><small>C · dark</small><img src="v2-fox-c.svg"></div>
</div>
</body>
</html>
